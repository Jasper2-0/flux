<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tesla by Sunflower — WebGL port</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    color: #9aa;
    font-family: "Lucida Console", Monaco, monospace;
    overflow: hidden;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 16px;
  }
  #screen {
    background: #000;
    max-width: 100vw;
    max-height: 100vh;
    aspect-ratio: 4 / 3;
    display: none;
  }
  #panel {
    text-align: center;
    max-width: 34em;
    line-height: 1.6;
  }
  #panel h1 {
    font-size: 18px;
    font-weight: normal;
    letter-spacing: 0.5em;
    color: #dde;
    margin-bottom: 4px;
  }
  #panel .sub { font-size: 12px; }
  #status { font-size: 12px; color: #667; min-height: 1.6em; }
  #play {
    margin-top: 12px;
    padding: 10px 42px;
    background: transparent;
    color: #dde;
    border: 1px solid #556;
    font: inherit;
    letter-spacing: 0.3em;
    cursor: pointer;
    display: none;
  }
  #play:hover { background: #112; }
  #hint { font-size: 11px; color: #445; margin-top: 10px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="panel">
    <h1>T E S L A</h1>
    <div class="sub">sunflower, 2000 &mdash; javascript / webgl port</div>
    <div id="status">loading...</div>
    <button id="play">play</button>
    <div id="hint">esc stops &middot; left/right arrows seek &plusmn;5s</div>
  </div>
  <canvas id="screen" width="960" height="720"></canvas>
</div>
<script type="module">
import { Demo } from './js/demo.js';

const canvas = document.getElementById('screen');
const panel = document.getElementById('panel');
const statusEl = document.getElementById('status');
const playBtn = document.getElementById('play');

const demo = new Demo(canvas, (msg) => { statusEl.textContent = msg; });
window.demo = demo; // handy for debugging / automated testing

try {
  await demo.load();
  statusEl.textContent = 'ready — 254 seconds, sound on';
  playBtn.style.display = 'inline-block';
} catch (err) {
  statusEl.textContent = 'error: ' + err.message;
  throw err;
}

playBtn.addEventListener('click', () => {
  panel.style.display = 'none';
  canvas.style.display = 'block';
  demo.start();
});

window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    demo.stop();
    canvas.style.display = 'none';
    panel.style.display = 'block';
    statusEl.textContent = 'stopped';
  } else if (e.key === 'ArrowRight') {
    demo.seek(demo.getTime() + 5);
  } else if (e.key === 'ArrowLeft') {
    demo.seek(demo.getTime() - 5);
  }
});
</script>
</body>
</html>
