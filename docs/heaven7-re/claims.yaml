# ------------------------------------------------------------- texture VM
- id: texvm.interp.addr
  statement: "The texture-generator interpreter is at .data:0x44189f and fetches operator ids with lodsb at 0x4418b7."
  evidence: BYTES
  check:
    kind: bytes
    addr: 0x4418b7
    expect: "ac"

- id: texvm.optable.addr
  statement: "The interpreter searches an operator table at .data:0x4429b8 with 8-byte entries."
  evidence: BYTES
  check:
    kind: bytes
    addr: 0x4418ba
    expect: "8b8bb8294400"

- id: texvm.optable.count
  statement: "The operator table has 26 zero-terminated 8-byte entries."
  evidence: BYTES
  check:
    kind: table_count
    addr: 0x4429b8
    entry_size: 8
    expect: 26

- id: texvm.optable.entry.0x11
  statement: "Operator id 0x11 maps to handler 0x441d57."
  evidence: BYTES
  check:
    kind: table_entry
    addr: 0x4429b8
    entry_size: 8
    index: 5
    expect_key: 0x11
    expect_value: 0x441d57

- id: texvm.optable.entry.0x12
  statement: "Operator id 0x12 maps to handler 0x441e67."
  evidence: BYTES
  check:
    kind: table_entry
    addr: 0x4429b8
    entry_size: 8
    index: 6
    expect_key: 0x12
    expect_value: 0x441e67

- id: texvm.optable.entry.0x41
  statement: "Operator id 0x41 maps to handler 0x442789."
  evidence: BYTES
  check:
    kind: table_entry
    addr: 0x4429b8
    entry_size: 8
    index: 23
    expect_key: 0x41
    expect_value: 0x442789

- id: texvm.prng.constant
  statement: "The PRNG at .data:0x4418f8 multiplies its state by 0xFACEDEAD then rcr 3, xchg ch,cl, inc."
  evidence: BYTES
  check:
    kind: bytes
    addr: 0x4418fe
    expect: "69c9addecefa c1d903 86cd 41"

- id: texvm.prng.rcr.hazard
  statement: "rcr is rotate-through-carry, so the incoming carry flag participates; a plain ror is not equivalent and desynchronises the sequence."
  evidence: DISASM
  locator: ".data:0x441904 (x86 semantics of rcr)"

- id: texvm.layer.shift
  statement: "Operators 0x01-0x04 resolve a layer address as (index << 0x12) + [0x44292c], i.e. 0x40000 bytes per layer."
  evidence: BYTES
  check:
    kind: bytes
    addr: 0x4418ea
    expect: "0fb6f0 c1e612 03352c294400"

- id: texvm.layer.size.meaning
  statement: "0x40000 bytes per layer equals 256*256*4, and the interpreter zeroes 0x50000 dwords = 5 layers."
  evidence: DISASM
  locator: ".data:0x4418a9 (mov ecx,0x50000) plus the shift above; arithmetic is exact, the 'five-layer bank' framing follows from it"

- id: texvm.carry.protocol
  statement: "The carry flag signals continue/stop to the interpreter: operator 0x12 ends with clc, the layer/output handler ends with stc."
  evidence: DISASM
  locator: ".data:0x441f0a (clc), .data:0x4418f6 (stc)"

- id: texvm.masks
  statement: ".data:0x441840 holds MMX channel masks 0x1f / 0x7e0-style values consistent with RGB 565/555."
  evidence: BYTES
  check:
    kind: u32
    addr: 0x441840
    expect: 0x0000001f

# ------------------------------------------------- texture operator semantics
- id: texop.0x12.valuenoise
  statement: "Operator 0x12 (0x441e67) is one octave of value noise: its last argument byte n sets lattice step 1<<n and amplitude 0x1000>>n, and output is replicated to greyscale via imul eax,eax,0x10101."
  evidence: DISASM
  locator: "texture-ops.txt, .data:0x441e67..0x441f0a"

- id: texop.0x12.amp.const
  statement: "Operator 0x12 loads base amplitude 0x1000 before shifting it right by n."
  evidence: BYTES
  check:
    kind: bytes
    addr: 0x441e7e
    expect: "bd00100000"

- id: texop.0x12.lattice8bit
  statement: "Operator 0x12 walks its lattice in 8-bit registers (add bl,dl / add bh,dl) and terminates on 8-bit wraparound, so 256x256 is hardwired into the operator."
  evidence: DISASM
  locator: "texture-ops.txt, .data:0x441e96..0x441e9c"

- id: texop.0x11.plasma
  statement: "Operator 0x11 (0x441d57) is plasma / diamond-square: it sums four neighbours, adds a scaled random displacement, and halves the step from 0x80."
  evidence: DISASM
  locator: "texture-ops.txt, .data:0x441d57..0x441dbc"

- id: texop.0x13.sine
  statement: "Operator 0x13 (0x441f0c) computes two sines (two fsin instructions) from (freq,phase) argument pairs, freq doubled and phase scaled by 1/128."
  evidence: DISASM
  locator: "texture-ops.txt, .data:0x441f0c..0x441f80"

- id: texop.0x15.radial
  statement: "Operator 0x15 (0x442050) forms (x-128)^2+(y-128)^2, takes fsqrt then fsin, giving concentric radial rings; its third argument (0x78=120) scales the radius."
  evidence: DISASM
  locator: "texture-ops.txt, .data:0x442050..0x4420b0"

- id: texop.0x41.blend
  statement: "Operator 0x41 (0x442789) resolves two layer addresses then combines them with punpcklbw/pmulhw/paddw/packuswb, i.e. a weighted blend of two layers."
  evidence: DISASM
  locator: "texture-ops.txt, .data:0x442789..0x442818"

- id: texop.0x21.spiral
  statement: "Operator 0x21 (0x44211a) is a radial/angular (spiral-family) pattern."
  evidence: INFER
  locator: "NOT ESTABLISHED — based only on an instruction census (2x fsin + fsqrt, no MMX) and its 9 argument bytes. The routine has not been read through."

- id: texop.0x40.perelement
  statement: "Operator 0x40 is a per-element operation (placing a feature repeatedly) rather than a whole-image filter."
  evidence: INFER
  locator: "based only on it appearing 14 times consecutively in program 5; the handler has not been read"

- id: texop.argconvention
  statement: "Operator arguments beginning 0x01/0x02 then 0x07 mean (target layer, channel mask = RGB)."
  evidence: INFER
  locator: "pattern across traced programs only; no handler has been read to confirm the field meanings"

- id: texop.families
  statement: "The operator id ranges correspond to sources, filters, combiners and colour operations."
  evidence: INFER
  locator: "grouping of ids is BYTES; the category names are guesses"

- id: texop.unreversed
  statement: "16 of the 23 used operators have not been read at all: 0x02-0x04 (variants), 0x10, 0x14, 0x20, 0x24, 0x31, 0x32, 0x33, 0x35, 0x36, 0x37, 0x40, 0x50, 0x51."
  evidence: TRACE
  locator: "complement of the DISASM claims above; recorded so the gap is explicit"

# --------------------------------------------------------- texture allocation
- id: texalloc.addr
  statement: "The texture allocator .text:0x4088c9 stores width from EAX at tex+0x18 and computes stride as ((w+7)&~7)*4."
  evidence: BYTES
  check:
    kind: bytes
    addr: 0x4088ca
    expect: "894618 83c007 83e0f8 c1e002"

- id: texalloc.callsite.256
  statement: "The call site .text:0x4089d5 passes width 0x100 (256) in EAX with EDX copied from it."
  evidence: BYTES
  check:
    kind: bytes
    addr: 0x4089d5
    expect: "b800010000 8bd0"

- id: texalloc.count
  statement: "The intro performs 11 texture allocations: ten 256x256 plus one 320x176."
  evidence: CROSS
  locator: "independent allocator hook (tools/emulate_count.py) counting .text:0x4088c9 calls, agreeing with 11 interpreter invocations traced separately. This is the measure that falsified the earlier claim of 3."

- id: texalloc.framebuffer
  statement: "The 320x176 allocation is the framebuffer sharing the texture allocator, leaving ten real textures."
  evidence: INFER
  locator: "the size matches the command-line render resolution; not otherwise confirmed"

