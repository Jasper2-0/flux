# Claim ledger for the Heaven 7 reverse engineering.
#
# Every factual claim made in README.md appears here with its provenance class
# (see METHODOLOGY.md). BYTES claims carry a `check` block and are re-verified
# against the binary by tools/verify_claims.py. Everything else is listed as
# unchecked, with a locator, so the unverified surface is always visible.
#
# Classes: BYTES | DISASM | TRACE | CROSS | INFER
# INFER = hypothesis, NOT evidence.

# ---------------------------------------------------------------- stream format
- id: decoder.varint.addr
  statement: "read_varint is at .text:0x4086b8 and begins movzx eax,[edi] / inc edi / shr eax,1."
  evidence: BYTES
  check:
    kind: bytes
    addr: 0x4086b8
    expect: "0fb607 47 d1e8"

- id: decoder.float.addr
  statement: "read_float is at .text:0x4086c8 and begins push ecx / xor eax,eax / test byte [edi],1."
  evidence: BYTES
  check:
    kind: bytes
    addr: 0x4086c8
    expect: "51 33c0 f60701"

- id: decoder.float.semantics
  statement: "read_float has three encodings (1-byte zero, 2-byte compact, 3-byte extended) and reconstructs the exponent as (((stored+0xE0)&0x1F)+0x7A)<<23."
  evidence: DISASM
  locator: "disasm-key-routines.txt, .text:0x4086c8..0x40871e"

- id: decoder.float.selftest
  statement: "The Python port of both decoders reproduces the documented encodings; a single 0x00 byte decodes to 0.0 consuming one byte."
  evidence: CROSS
  locator: "tools/decoders.py self-tests (transcription vs. disassembly)"

# ------------------------------------------------------------- scene-script VM
- id: scriptvm.loop.addr
  statement: "The scene-script VM fetches its opcode at .text:0x40a624 with movzx eax,byte [edi]."
  evidence: BYTES
  check:
    kind: bytes
    addr: 0x40a624
    expect: "0fb607 47"

- id: scriptvm.dispatch.table.addr
  statement: "Opcode dispatch reads a 16-bit offset from .data:0x440f67 indexed by opcode*2."
  evidence: BYTES
  check:
    kind: bytes
    addr: 0x40a62c
    expect: "0fb70445670f4400"

- id: scriptvm.dispatch.op1
  statement: "Script opcode 1 dispatches to 0x404057."
  evidence: BYTES
  check:
    kind: dispatch16
    addr: 0x440f67
    op: 1
    expect: 0x404057

- id: scriptvm.dispatch.op2
  statement: "Script opcode 2 dispatches to 0x404154."
  evidence: BYTES
  check:
    kind: dispatch16
    addr: 0x440f67
    op: 2
    expect: 0x404154

- id: script.start.addr
  statement: "The scene script begins at .data:0x418dca and its first opcode byte is 0x01."
  evidence: BYTES
  check:
    kind: u8
    addr: 0x418dca
    expect: 0x01

- id: script.extent
  statement: "The script spans 0x418dca..0x4291d5 and comprises 970 opcodes / 5495 decoded values."
  evidence: TRACE
  locator: "tools/emulate_extract_full.py, 3e9 instruction budget; stop reason: emulation fault at 0x40de23 in the sound path AFTER the script was fully walked. NOTE: this run did not terminate cleanly, so per METHODOLOGY.md rule 1 the extent is a LOWER BOUND, not proven complete."

- id: script.objects.structure
  statement: "Opcodes 1 and 2 occur in near-equal numbers, reading as define/commit pairs, one per scene object or animation block."
  evidence: INFER
  locator: "scene-script.txt opcode histogram; the pairing is a pattern, the 'object' meaning is not established"

- id: script.op4.blob
  statement: "Script opcode 4 consumes ~5.4KB of inline data that is 64% 0xff bytes, so it is bitmap/image data rather than a texture program."
  evidence: TRACE
  locator: "byte histogram of 0x418ddc..0x41a2dc; the 'bitmap' reading is INFER on top of the measured histogram"

- id: script.handler.0x406a39.schema
  statement: "Handler .text:0x406a39 reads 3 varints into object+0x174/+0x178/+0x19c then N*6 floats at object+0x1a0 (40-byte stride) then 4 floats at object+0x17c."
  evidence: DISASM
  locator: "disasm-key-routines.txt, .text:0x406a39"

- id: script.handlers.primitive.names
  statement: "The other script handlers correspond to sphere, plane, light, camera path and text primitives."
  evidence: INFER
  locator: "NOT ESTABLISHED — these names were assigned by analogy and no handler has been read to confirm any of them."

- id: script.values.lightdir
  statement: "The decoded stream contains 0.5771,0.5771,-0.5771, a unit vector (1/sqrt3)."
  evidence: TRACE
  locator: "scene-script.txt, offset 0x41a340. That the vector IS a light direction is INFER."

