- id: texprog.addresses
  statement: "There are 11 texture programs, at 0x41b6b1, 0x41b6be, 0x41b6cf, 0x41b9d6, 0x428de8, 0x428e74, 0x428ef5, 0x428f97, 0x428fc2, 0x428fe5, 0x429137."
  evidence: CROSS
  locator: "interpreter-entry trace (tools/emulate_extract_full.py) cross-checked against the independent allocator count of 11"

- id: texprog.first.byte
  statement: "The first texture program at 0x41b6b1 starts with operator id 0x15."
  evidence: BYTES
  check:
    kind: u8
    addr: 0x41b6b1
    expect: 0x15

- id: texprog.pool2.first.byte
  statement: "The second program pool begins at 0x428de8 with operator id 0x11."
  evidence: BYTES
  check:
    kind: u8
    addr: 0x428de8
    expect: 0x11

- id: texprog.operators.used
  statement: "23 of the 26 operators are used across 148 invocations; 0x22, 0x30 and 0x34 are never used."
  evidence: TRACE
  locator: "tools/emulate_extract_full.py. Stop reason was an emulation fault in the sound path, NOT clean program exit, so per METHODOLOGY.md this remains a lower bound on operator usage."

- id: texprog.terminators
  statement: "Every program ends on an operator in 0x01-0x04, which combined with the index<<18 layer resolver means the terminating opcode is itself the destination layer index."
  evidence: TRACE
  locator: "all 11 programs in texture-programs.txt; the layer-index reading is DISASM (texvm.layer.shift)"

# ------------------------------------------------------------- shade tree
- id: shadetree.addr
  statement: "The material/shade-tree evaluator is at .text:0x4023b7, recursing over 32-byte nodes and sampling a texture via node+0x04 with UV masks 0x3fc00/0x3fc."
  evidence: DISASM
  locator: "disasm-key-routines.txt, .text:0x4023b7"

- id: shadetree.hardcoded256
  statement: "The sampler's masks and shifts hardwire 256x256 with a 1024-byte stride, matching the allocator's stride for w=256."
  evidence: DISASM
  locator: ".text:0x4023d8..0x4023ef combined with texalloc.addr"

- id: bumpmap.addr
  statement: "Bump-mapped shading at .text:0x40ae01 samples signed 16-bit texels (fimul word[...]) to perturb the normal."
  evidence: DISASM
  locator: "disasm-key-routines.txt, .text:0x40ae01"

# ----------------------------------------------------------------- remaster
- id: remaster.octave.rule
  statement: "At 4x, lattice-based generators (0x11, 0x12) need +2 octaves / 2 extra subdivision levels and renormalisation, while analytic generators (0x13, 0x15) only need their normalisation constants changed."
  evidence: DISASM
  locator: "follows from texop.0x11.plasma, texop.0x12.valuenoise, texop.0x13.sine, texop.0x15.radial. Applies only to the four operators actually read; the other 19 used operators have unknown scaling behaviour."

- id: remaster.prng.ordering
  statement: "Because coarse levels consume PRNG draws before fine ones, starting plasma at a 4x-larger step reproduces the original's coarse draws in identical order, so large-scale structure stays bit-identical."
  evidence: INFER
  locator: "reasoned from the traversal order in texop.0x11.plasma; NOT empirically verified by diffing a re-run against the original buffers"

